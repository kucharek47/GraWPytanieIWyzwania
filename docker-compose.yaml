services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "13001:13001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:13001/', timeout=2)"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
